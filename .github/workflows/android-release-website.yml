name: Sync Android release to app and website

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the current release is already live
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-release-website
  cancel-in-progress: false

jobs:
  update-website:
    if: >-
      github.repository == 'Ishidd/ginhawa-landing' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'android-v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check release validation
        run: node --test scripts/android-release.test.mjs scripts/github-android-release.test.mjs scripts/firestore-android-release.test.mjs scripts/android-apk.test.mjs
      - name: Authenticate with the dedicated release identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ginhawa-82218
          workload_identity_provider: projects/467523888732/locations/global/workloadIdentityPools/ginhawa-releases/providers/github
          service_account: ginhawa-release-publisher@ginhawa-82218.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify public APK, sync Firestore and update website
        env:
          GINHAWA_RELEASE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_RELEASE_DEPLOY_HOOK: ${{ secrets.VERCEL_RELEASE_DEPLOY_HOOK }}
        run: node scripts/publish-android-release.mjs
